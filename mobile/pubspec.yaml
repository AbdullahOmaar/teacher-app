name: mister
description: "تطبيق موبايل مستر — إدارة السنتر (Flutter). V1: تطبيق المدرّس وفريقه."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.0
  flutter_secure_storage: ^9.2.2
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  # الخطوط (IBM Plex Sans Arabic ‏400–700) تهبط في F1-T3 (الخط ب — الثيم):
  # ملفات TTF في assets/fonts/ + كتلة fonts هنا. الويب عنده woff/woff2 فقط
  # (dist/assets) — لا TTF محليًا — فلا تُخترع ملفات وهمية في الهيكل.
