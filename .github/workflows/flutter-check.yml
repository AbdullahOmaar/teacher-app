name: flutter-check

# بوابة فحص فلاتر (mobile/) — منفصلة تمامًا عن CI الويب:
# لا تعمل إلا عند تغيّر ملفات mobile/** (تغيّرات الويب لا تشغّلها)،
# وبالمثل CI الويب (ci.yml) يتجاهل mobile/** عبر paths-ignore.
# داخل mobile/: analyze + gen-l10n + اكتمال ARB (لغتان) + اختبارات + بناء APK دخاني.
on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-check.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-check.yml'

permissions:
  contents: read

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      SUPABASE_URL: ${{ secrets.DEMO_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.DEMO_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: ARB parity (AR == EN keys, placeholders match)
        run: node scripts/check-arb.mjs
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build APK (smoke — يثبت أن الهيكل يُبنى)
        env:
          APP_VERSION_REF: ${{ github.ref_name }}
        run: >-
          flutter build apk --release --obfuscate --split-debug-info=build/debug-info
          --dart-define=APP_VERSION="$APP_VERSION_REF"
          --dart-define=APP_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          --dart-define=SUPABASE_URL=$SUPABASE_URL
          --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
