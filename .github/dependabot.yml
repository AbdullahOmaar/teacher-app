# تحديثات اعتماديات أسبوعية (§9/§15 من المعيار — 3A-302).
# PRs التحديث تُعامل كأي كود: بوابة CI خضراء + قراءة ملخص التغييرات
# قبل الدمج (انظر docs/DEPENDENCY-POLICY.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
