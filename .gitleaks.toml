# Gitleaks — كشف الأسرار في الكود والتاريخ (وظيفة security-scan في CI).
#
# [extend] useDefault = true صريحة عمداً (فخ القواعد الصفرية — مهمة
# Phase 2 رقم 3): ملف إعداد بلا هذا السطر يفحص بصفر قاعدة ويمرّ أخضر
# كاذباً. أي استثناء مستقبلي (allowlist) يُضاف هنا مع سببه وتاريخه،
# ولا يُسكَّت الماسح أبداً بلا تصريح مكتوب.
[extend]
useDefault = true
