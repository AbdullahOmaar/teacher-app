<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PWA (خطوة 11): manifest + لون ثيم من توكن «نيلي الثقة» الأساسي -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="إدارة الحصص والحضور والطلاب والفواتير للمدرس — تسجيل الحضور يعمل أوفلاين ويتزامن تلقائياً" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="المدرس" />
    <script>
      // تهيئة الثيم قبل أول رسم (إصلاح QA الخطوة 14): خطاف useTheme راكب
      // داخل AppShell فقط، فالصفحات العامة (الدخول/البوابة) كانت تظهر
      // بالفاتح دائماً مهما كان الثيم المحفوظ أو النظامي. نفس منطق
      // resolveDark في src/hooks/useTheme.ts ونفس مفتاح التخزين حرفياً،
      // وبلا وميض لأنها تعمل قبل تصيير أي محتوى.
      try {
        var savedTheme = localStorage.getItem('teacher-app-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme =
          savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark) ? 'dark' : 'light'
      } catch (e) {
        /* بلا وصول للتخزين: يبقى الافتراضي الفاتح من CSS */
      }
    </script>
    <title>تطبيق المدرس</title>
    <!-- الخط (IBM Plex Sans Arabic) مضمّن محلياً عبر @fontsource في main.tsx — لا روابط خطوط خارجية -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
